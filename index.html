<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#050914">
  <meta name="description" content="DANIYAR — Developer & Creator. Contact card.">
  <title>DANIYAR — Developer & Creator</title>
  <style>
    :root {
      color-scheme: dark;
      --gold: #e9c878;
      --gold-bright: #fff0b6;
      --gold-deep: #b38732;
      --blue: #42a5ff;
      --white: #f4f7ff;
      --muted: #9ba9c4;
    }
    * { box-sizing: border-box; }
    html, body { min-height: 100%; }
    body {
      margin: 0;
      min-height: 100svh;
      display: grid;
      place-items: center;
      overflow-x: hidden;
      overflow-y: auto;
      padding: 24px;
      color: var(--white);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background:
        radial-gradient(ellipse at 50% 45%, rgba(17, 62, 122, .30), transparent 50%),
        radial-gradient(ellipse at 15% 15%, rgba(19, 65, 130, .20), transparent 36%),
        linear-gradient(145deg, #030711 0%, #071329 48%, #02050d 100%);
    }
    .scene {
      position: fixed; inset: 0; overflow: hidden; pointer-events: none;
      perspective: 1000px;
    }
    .scene::before, .scene::after {
      content: ""; position: absolute; width: 75vw; height: 75vw; max-width: 900px; max-height: 900px;
      border: 1px solid rgba(59, 153, 255, .12); border-radius: 50%;
      left: 50%; top: 50%; transform: translate(-50%, -50%) rotateX(72deg);
      box-shadow: 0 0 70px rgba(29, 123, 255, .08), inset 0 0 70px rgba(29, 123, 255, .05);
      animation: wave 13s ease-in-out infinite alternate;
    }
    .scene::after {
      width: 105vw; height: 105vw; border-color: rgba(73, 155, 255, .07);
      animation-duration: 19s; animation-direction: alternate-reverse;
    }
    @keyframes wave {
      from { transform: translate(-50%, -50%) rotateX(72deg) scale(.92); opacity: .45; }
      to { transform: translate(-50%, -50%) rotateX(72deg) scale(1.08); opacity: 1; }
    }
    #stars { position: absolute; inset: 0; width: 100%; height: 100%; }
    .glow {
      position: absolute; width: 420px; height: 420px; border-radius: 50%;
      background: rgba(0, 112, 255, .13); filter: blur(100px);
      left: 50%; top: 50%; transform: translate(-50%, -50%);
    }
    .card-wrap {
      width: min(100%, 396px);
      perspective: 1200px;
      z-index: 1;
      margin: auto;
    }
    .card {
      --rx: 0deg; --ry: 0deg; --mx: 50%; --my: 50%;
      position: relative;
      width: 100%;
      padding: 38px 30px 24px;
      display: flex;
      flex-direction: column;
      align-items: center;
      border: 1px solid rgba(233, 200, 120, .52);
      border-radius: 28px;
      overflow: hidden;
      isolation: isolate;
      background:
        linear-gradient(150deg, rgba(19, 40, 78, .94), rgba(5, 12, 28, .97) 56%, rgba(8, 24, 50, .95));
      box-shadow:
        0 35px 90px rgba(0, 0, 0, .6),
        0 0 60px rgba(31, 122, 235, .14),
        inset 0 1px 0 rgba(255, 255, 255, .11);
      transform: rotateX(var(--rx)) rotateY(var(--ry));
      transform-style: preserve-3d;
      transition: transform .18s ease-out, box-shadow .35s ease;
      will-change: transform;
    }
    .card::before {
      content: ""; position: absolute; inset: 0; z-index: -1; pointer-events: none;
      background: radial-gradient(circle at var(--mx) var(--my), rgba(92, 174, 255, .21), transparent 40%);
    }
    .card::after {
      content: ""; position: absolute; inset: 10px; border: 1px solid rgba(255,255,255,.06);
      border-radius: 20px; pointer-events: none;
    }
    .top-line {
      position: absolute; top: 0; left: 14%; right: 14%; height: 1px;
      background: linear-gradient(90deg, transparent, var(--gold), transparent);
      box-shadow: 0 0 14px rgba(233, 200, 120, .6);
    }

    /* Четкий мини-QR в правом верхнем углу */
    .qr-corner {
      position: absolute;
      top: 16px;
      right: 16px;
      z-index: 10;
      width: 62px;
      height: 62px;
      padding: 4px;
      border-radius: 13px;
      border: 1px solid rgba(233, 200, 120, .58);
      background: #ffffff;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 6px 20px rgba(0, 0, 0, .5), 0 0 14px rgba(233, 200, 120, .2);
      transition: transform .22s ease, box-shadow .22s ease, border-color .22s ease;
      transform: translateZ(44px);
    }
    .qr-corner:hover {
      transform: translateZ(50px) scale(1.07);
      border-color: var(--gold-bright);
      box-shadow: 0 8px 24px rgba(233, 200, 120, .35);
    }
    .qr-corner svg, .qr-corner canvas {
      width: 100%;
      height: 100%;
      display: block;
      border-radius: 7px;
    }
    .qr-badge {
      position: absolute;
      bottom: -7px;
      left: 50%;
      transform: translateX(-50%);
      background: linear-gradient(90deg, #0b1936, #163468);
      border: 1px solid rgba(233, 200, 120, .75);
      color: var(--gold-bright);
      font-size: 7.5px;
      font-weight: 700;
      letter-spacing: .12em;
      padding: 1.5px 6px;
      border-radius: 6px;
      text-transform: uppercase;
      white-space: nowrap;
    }

    .brand { display: flex; flex-direction: column; align-items: center; transform: translateZ(38px); }
    .monogram {
      width: 104px; height: 104px; display: grid; place-items: center; position: relative;
      margin-bottom: 16px;
    }
    .monogram::before, .monogram::after {
      content: ""; position: absolute; inset: 7px; border: 1px solid rgba(233, 200, 120, .72);
      border-radius: 50%; transform: rotate(-28deg) scaleX(1.28);
      box-shadow: 0 0 18px rgba(233, 200, 120, .15);
    }
    .monogram::after {
      inset: 1px 13px; transform: rotate(55deg) scaleX(1.15);
      border-color: rgba(67, 160, 255, .58);
    }
    .monogram span {
      font-family: Georgia, "Times New Roman", serif; font-size: 68px; line-height: 1;
      font-weight: 400; color: transparent;
      background: linear-gradient(135deg, #fff4c9 12%, #d5a94e 48%, #fff0b6 75%, #a87928);
      background-clip: text; -webkit-background-clip: text;
      filter: drop-shadow(0 0 12px rgba(233, 200, 120, .32));
    }
    h1 {
      margin: 0; font-family: Georgia, "Times New Roman", serif;
      font-size: 31px; font-weight: 500; letter-spacing: .2em; padding-left: .2em;
      color: var(--gold-bright); text-shadow: 0 0 20px rgba(233, 200, 120, .25);
    }
    .subtitle {
      margin: 8px 0 0; color: #b6c4dc; font-size: 10.5px; letter-spacing: .28em;
      text-transform: uppercase;
    }
    .separator {
      width: 100%; display: flex; align-items: center; gap: 12px; margin: 24px 0 16px;
      color: var(--gold); opacity: .8;
    }
    .separator::before, .separator::after {
      content: ""; height: 1px; flex: 1;
      background: linear-gradient(90deg, transparent, rgba(233,200,120,.65));
    }
    .separator::after { transform: scaleX(-1); }
    .separator span { font-size: 9px; letter-spacing: .3em; text-transform: uppercase; }

    .links { width: 100%; display: grid; gap: 10px; transform: translateZ(25px); }
    .contact {
      min-height: 48px; display: flex; align-items: center; gap: 13px;
      padding: 0 16px; border: 1px solid rgba(126, 164, 218, .22); border-radius: 13px;
      background: linear-gradient(100deg, rgba(18, 40, 76, .8), rgba(9, 21, 42, .64));
      color: #eef4ff; text-decoration: none; font-size: 13px; letter-spacing: .04em;
      transition: transform .22s ease, border-color .22s ease, box-shadow .22s ease, background .22s ease;
      -webkit-tap-highlight-color: transparent;
    }
    .contact:hover, .contact:focus-visible {
      outline: none; transform: translateY(-2px) translateZ(6px);
      border-color: rgba(75, 170, 255, .85);
      background: linear-gradient(100deg, rgba(22, 60, 108, .94), rgba(10, 30, 59, .82));
      box-shadow: 0 8px 24px rgba(0, 119, 255, .18), inset 0 0 16px rgba(49, 145, 255, .08);
    }
    .contact svg { width: 18px; height: 18px; flex: 0 0 18px; color: var(--gold); }
    .contact .arrow { margin-left: auto; color: #83a2c8; font-size: 16px; transition: transform .2s ease, color .2s ease; }
    .contact:hover .arrow { transform: translate(2px, -2px); color: var(--gold-bright); }

    /* Единственная кнопка оплаты MBANK внизу */
    .pay-action {
      width: 100%;
      margin-top: 14px;
      transform: translateZ(28px);
    }
    .pay-btn {
      width: 100%;
      min-height: 50px;
      padding: 0 18px;
      border-radius: 14px;
      border: 1px solid rgba(255, 240, 182, .75);
      background: linear-gradient(110deg, #e7c26e 0%, #fff0b6 48%, #c9993c 100%);
      color: #061024;
      font-family: inherit;
      font-size: 12.5px;
      font-weight: 700;
      letter-spacing: .14em;
      text-transform: uppercase;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      cursor: pointer;
      box-shadow: 0 10px 28px rgba(233, 200, 120, .26), inset 0 1px 0 rgba(255,255,255,.75);
      transition: transform .2s ease, box-shadow .2s ease, filter .2s ease;
    }
    .pay-btn:hover {
      transform: translateY(-2px);
      filter: brightness(1.04);
      box-shadow: 0 12px 34px rgba(233, 200, 120, .4), inset 0 1px 0 rgba(255,255,255,.9);
    }
    .pay-btn:active {
      transform: translateY(0);
    }
    .pay-btn svg {
      width: 18px;
      height: 18px;
      flex: 0 0 18px;
    }

    footer {
      width: 100%; margin-top: 18px; text-align: center;
      color: #8796b2; font-size: 9px; letter-spacing: .25em;
    }
    footer::before {
      content: ""; display: block; height: 1px; width: 100%; margin-bottom: 14px;
      background: linear-gradient(90deg, transparent, rgba(233,200,120,.55), transparent);
    }
    .hint {
      position: fixed; bottom: 14px; left: 0; right: 0; z-index: 2; text-align: center;
      color: rgba(169, 190, 220, .45); font-size: 10px; letter-spacing: .16em;
      text-transform: uppercase; pointer-events: none;
    }

    /* Модальное окно раздела QR-кода */
    .modal {
      position: fixed;
      inset: 0;
      z-index: 50;
      display: grid;
      place-items: center;
      padding: 20px;
      background: rgba(2, 6, 15, .84);
      backdrop-filter: blur(12px);
      opacity: 0;
      pointer-events: none;
      transition: opacity .22s ease;
    }
    .modal.active {
      opacity: 1;
      pointer-events: auto;
    }
    .modal-box {
      width: min(100%, 320px);
      padding: 24px 20px 20px;
      border-radius: 24px;
      border: 1px solid rgba(233, 200, 120, .6);
      background: linear-gradient(155deg, rgba(17, 36, 72, .97), rgba(6, 14, 32, .99));
      box-shadow: 0 25px 70px rgba(0,0,0,.75), 0 0 40px rgba(233, 200, 120, .16);
      text-align: center;
      transform: scale(.94);
      transition: transform .22s ease;
    }
    .modal.active .modal-box {
      transform: scale(1);
    }
    .modal-title {
      font-size: 11px;
      letter-spacing: .24em;
      text-transform: uppercase;
      color: var(--gold-bright);
      margin: 0 0 4px;
    }
    .modal-sub {
      font-size: 12.5px;
      color: #c6d2e8;
      margin: 0 0 14px;
    }
    .qr-large {
      width: 216px;
      height: 216px;
      margin: 0 auto 14px;
      padding: 10px;
      border-radius: 18px;
      background: #ffffff;
      border: 2px solid rgba(233, 200, 120, .85);
      box-shadow: 0 0 24px rgba(233, 200, 120, .22);
      display: grid;
      place-items: center;
    }
    .qr-large svg, .qr-large canvas {
      width: 100%;
      height: 100%;
      display: block;
    }
    .phone-copy {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
      padding: 10px 14px;
      border-radius: 11px;
      border: 1px solid rgba(126, 164, 218, .28);
      background: rgba(17, 38, 72, .75);
      color: var(--white);
      font-size: 12.5px;
      cursor: pointer;
    }
    .close-btn {
      display: block;
      width: 100%;
      margin-top: 10px;
      padding: 8px;
      background: transparent;
      border: none;
      color: var(--muted);
      font-size: 11px;
      letter-spacing: .18em;
      text-transform: uppercase;
      cursor: pointer;
    }
    .close-btn:hover { color: var(--white); }

    @media (max-width: 480px) {
      body { padding: 14px; }
      .card { padding: 32px 22px 20px; border-radius: 24px; }
      .qr-corner { width: 56px; height: 56px; top: 14px; right: 14px; }
      .monogram { width: 96px; height: 96px; }
      .monogram span { font-size: 62px; }
      h1 { font-size: 27px; }
      .separator { margin: 20px 0 14px; }
      .contact { min-height: 46px; }
      .hint { display: none; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; }
    }
  </style>
</head>
<body>
  <div class="scene" aria-hidden="true">
    <div class="glow"></div>
    <canvas id="stars"></canvas>
  </div>

  <main class="card-wrap">
    <section class="card" id="card" aria-label="DANIYAR contact card">
      <div class="top-line"></div>

      <!-- Четкий QR-код в правом верхнем углу -->
      <button type="button" class="qr-corner" id="openQr" title="Открыть QR для оплаты MBANK" aria-label="Открыть QR-код">
        <div id="miniQrSlot" style="width:100%;height:100%;"></div>
        <span class="qr-badge">ELQR</span>
      </button>

      <div class="brand">

      <div class="separator"><span>Get in touch</span></div>

      <nav class="links" aria-label="Contact links">

        <a class="contact" href="https://t.me/Dancho_kg" target="_blank" rel="noopener noreferrer">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m21 3-7.2 18-3.9-8.1L2 9.2 21 3Z"/><path d="M9.9 12.9 21 3"/></svg>
          <span>Telegram</span><span class="arrow">↗</span>

        <a class="contact" href="https://wa.me/996702431642" target="_blank" rel="noopener noreferrer">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20.4 11.8a8.4 8.4 0 0 1-12.5 7.3L3 20l.9-4.7a8.4 8.4 0 1 1 16.5-3.5Z"/><path d="M8.4 8.2c.2-.5.5-.5.8-.5h.5c.2 0 .4.1.5.4l.7 1.6c.1.3.1.5-.1.7l-.5.6c-.2.2-.2.4 0 .7.6 1 1.4 1.7 2.4 2.2.3.1.5.1.7-.1l.7-.8c.2-.2.4-.3.7-.2l1.5.7c.3.1.4.3.4.5 0 .4-.2 1.1-.6 1.4-.4.4-1 .6-1.6.5-1-.1-2.3-.7-3.7-1.9-1.2-1-2.1-2.4-2.4-3.4-.3-.9 0-1.7.4-2.4Z"/></svg>

          <span>TikTok</span><span class="arrow">↗</span>

        <!-- Instagram -->
        <a class="contact" href="https://www.instagram.com/shayloobekov.1?gwpx=dWdiOHVqcjUwYW92&utm_source=qr" target="_blank" rel="noopener noreferrer">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.5" cy="6.5" r="1" fill="currentColor" stroke="none"/></svg>
          <span>Instagram</span><span class="arrow">↗</span>
        </a>
      </nav>

      <!-- Единственная кнопка оплаты внизу -->
      <div class="pay-action">
        <button type="button" class="pay-btn" id="payMbankBtn">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <rect x="2" y="5" width="20" height="14" rx="2"/>
            <line x1="2" y1="10" x2="22" y2="10"/>
          </svg>
          <span>Оплатить MBANK</span>

      <footer>© 2026 DANIYAR</footer>
    </section>
  </main>

  <!-- Модальное окно раздела QR-кода -->
  <div class="modal" id="qrModal" role="dialog" aria-modal="true" aria-label="QR-код для оплаты">
    <div class="modal-box">
      <p class="modal-title">MBANK • ELQR</p>
      <p class="modal-sub">Daniyar Sh • +996 702 431 642</p>
      <div class="qr-large" id="largeQrSlot"></div>
      <button type="button" class="phone-copy" id="copyPhone">
        <span>+996 (702) 431 642</span>
        <span id="copyState" style="color:var(--gold);font-size:11px;">Копировать</span>
      </button>
      <button type="button" class="close-btn" id="closeQr">Закрыть</button>
    </div>
  </div>

  <div class="hint" aria-hidden="true">Move your cursor to explore</div>

  <script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.min.js"></script>
  <script>
    (() => {
      const exactQrPayload = "00020101021132440012c2c.mbank.kg01020210129967024316421302125204999953034175910Daniiar Sh6304d51b";
      const payQrUrl = "https://pay.payqr.kg/qr/#00020101021132440012c2c.mbank.kg01020210129967024316421302125204999953034175910Daniiar%20Sh6304d51b";

      function renderExactQR(targetId, marginModules) {
        const el = document.getElementById(targetId);
        if (!el || typeof qrcode === 'undefined') return;

        const qr = qrcode(0, 'M');
        qr.addData(exactQrPayload);
        qr.make();

        const count = qr.getModuleCount();
        const pad = marginModules;
        const total = count + pad * 2;
        let paths = '';

        for (let r = 0; r < count; r++) {
          for (let c = 0; c < count; c++) {
            if (qr.isDark(r, c)) {
              paths += `M${c + pad},${r + pad}h1v1h-1z`;
            }
          }
        }

        el.innerHTML = `<svg viewBox="0 0 ${total} ${total}" width="100%" height="100%" xmlns="http://www.w3.org/2000/svg" shape-rendering="crispEdges">
          <rect width="${total}" height="${total}" fill="#ffffff"/>
          <path d="${paths}" fill="#061024"/>
        </svg>`;
      }

      renderExactQR('miniQrSlot', 2);
      renderExactQR('largeQrSlot', 3);

      const modal = document.getElementById('qrModal');
      document.getElementById('openQr').addEventListener('click', () => modal.classList.add('active'));
      document.getElementById('closeQr').addEventListener('click', () => modal.classList.remove('active'));
      modal.addEventListener('click', (e) => {
        if (e.target === modal) modal.classList.remove('active');
      });

      document.getElementById('payMbankBtn').addEventListener('click', () => {
        const isMobile = /Android|iPhone|iPad|iPod/i.test(navigator.userAgent);
        if (isMobile) {
          const start = Date.now();
          window.location.href = "mbank://transfer?phone=996702431642";
          setTimeout(() => {
            if (Date.now() - start < 1700) {
              window.open(payQrUrl, "_blank", "noopener,noreferrer");
            }
          }, 900);
        } else {
          window.open(payQrUrl, "_blank", "noopener,noreferrer");
        }
      });

      document.getElementById('copyPhone').addEventListener('click', () => {
        navigator.clipboard?.writeText('+996702431642');
        const st = document.getElementById('copyState');
        st.textContent = 'Скопировано ✓';
        setTimeout(() => { st.textContent = 'Копировать'; }, 1800);
      });

      const card = document.getElementById('card');
      const wrap = document.querySelector('.card-wrap');
      const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      let frame = 0;

      function setTilt(x, y, rect) {
        const px = (x - rect.left) / rect.width;
        const py = (y - rect.top) / rect.height;
        const rotateY = (px - 0.5) * 16;
        const rotateX = (0.5 - py) * 16;
        card.style.setProperty('--rx', rotateX.toFixed(2) + 'deg');
        card.style.setProperty('--ry', rotateY.toFixed(2) + 'deg');
        card.style.setProperty('--mx', (px * 100).toFixed(1) + '%');
        card.style.setProperty('--my', (py * 100).toFixed(1) + '%');
      }
      function resetTilt() {
        card.style.setProperty('--rx', '0deg');
        card.style.setProperty('--ry', '0deg');
        card.style.setProperty('--mx', '50%');
        card.style.setProperty('--my', '50%');
      }

      if (!reduceMotion) {
        wrap.addEventListener('pointermove', (event) => {
          if (event.pointerType === 'touch') return;
          cancelAnimationFrame(frame);
          frame = requestAnimationFrame(() => setTilt(event.clientX, event.clientY, card.getBoundingClientRect()));
        });
        wrap.addEventListener('pointerleave', resetTilt);

        let touchActive = false;
        wrap.addEventListener('touchstart', () => { touchActive = true; }, { passive: true });
        wrap.addEventListener('touchmove', (event) => {
          if (!touchActive || !event.touches.length) return;
          const t = event.touches[0];
          setTilt(t.clientX, t.clientY, card.getBoundingClientRect());
        }, { passive: true });
        wrap.addEventListener('touchend', () => { touchActive = false; resetTilt(); }, { passive: true });

        const enableOrientation = () => {
          if (!('DeviceOrientationEvent' in window)) return;
          const handle = (event) => {
            if (event.beta == null || event.gamma == null) return;
            const rx = Math.max(-10, Math.min(10, (event.beta - 45) * .22));
            const ry = Math.max(-10, Math.min(10, event.gamma * .22));
            card.style.setProperty('--rx', rx.toFixed(2) + 'deg');
            card.style.setProperty('--ry', ry.toFixed(2) + 'deg');
          };
          window.addEventListener('deviceorientation', handle, { passive: true });
        };
        if (typeof DeviceOrientationEvent !== 'undefined' &&
            typeof DeviceOrientationEvent.requestPermission === 'function') {
          document.addEventListener('click', function askOrientation() {
            DeviceOrientationEvent.requestPermission().then(result => {
              if (result === 'granted') enableOrientation();
            }).catch(() => {});
            document.removeEventListener('click', askOrientation);
          }, { once: true });
        } else {
          enableOrientation();
        }
      }

      const canvas = document.getElementById('stars');
      const ctx = canvas.getContext('2d');
      let stars = [];
      function resize() {
        const dpr = Math.min(window.devicePixelRatio || 1, 2);
        canvas.width = Math.floor(innerWidth * dpr);
        canvas.height = Math.floor(innerHeight * dpr);
        canvas.style.width = innerWidth + 'px';
        canvas.style.height = innerHeight + 'px';
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        stars = Array.from({ length: Math.min(100, Math.floor(innerWidth * innerHeight / 11000)) }, () => ({
          x: Math.random() * innerWidth, y: Math.random() * innerHeight,
          r: Math.random() * 1.35 + .25, a: Math.random() * .55 + .12,
          speed: Math.random() * .18 + .035, phase: Math.random() * Math.PI * 2
        }));
      }
      let tick = 0;
      function draw() {
        ctx.clearRect(0, 0, innerWidth, innerHeight);
        tick += .012;
        for (const s of stars) {
          const alpha = s.a * (.65 + .35 * Math.sin(tick * s.speed * 12 + s.phase));
          ctx.beginPath();
          ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
          ctx.fillStyle = `rgba(177, 211, 255, ${alpha})`;
          ctx.fill();
        }
        if (!reduceMotion) requestAnimationFrame(draw);
      }
      resize();
      draw();
      window.addEventListener('resize', resize, { passive: true });
    })();
  </script>
</body>
</html>
