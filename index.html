<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#050914">
  <meta name="description" content="DANIYAR — Developer & Creator. Contact card.">
  <title>DANIYAR — Developer & Creator</title>
  <style>
    :root {
      color-scheme: dark;
      --gold: #e9c878;
      --gold-bright: #fff0b6;
      --blue: #42a5ff;
      --white: #f4f7ff;
      --muted: #9ba9c4;
      --panel: rgba(10, 20, 43, .78);
    }
    * { box-sizing: border-box; }
    html, body { min-height: 100%; }
    body {
      margin: 0;
      min-height: 100svh;
      display: grid;
      place-items: center;
      overflow: hidden;
      padding: 24px;
      color: var(--white);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background:
        radial-gradient(ellipse at 50% 45%, rgba(17, 62, 122, .28), transparent 48%),
        radial-gradient(ellipse at 15% 15%, rgba(19, 65, 130, .18), transparent 35%),
        linear-gradient(145deg, #030711 0%, #071329 48%, #02050d 100%);
    }
    .scene {
      position: fixed; inset: 0; overflow: hidden; pointer-events: none;
      perspective: 1000px;
    }
    .scene::before, .scene::after {
      content: ""; position: absolute; width: 75vw; height: 75vw; max-width: 900px; max-height: 900px;
      border: 1px solid rgba(59, 153, 255, .12); border-radius: 50%;
      left: 50%; top: 50%; transform: translate(-50%, -50%) rotateX(72deg);
      box-shadow: 0 0 70px rgba(29, 123, 255, .08), inset 0 0 70px rgba(29, 123, 255, .05);
      animation: wave 13s ease-in-out infinite alternate;
    }
    .scene::after {
      width: 105vw; height: 105vw; border-color: rgba(73, 155, 255, .07);
      animation-duration: 19s; animation-direction: alternate-reverse;
    }
    @keyframes wave {
      from { transform: translate(-50%, -50%) rotateX(72deg) scale(.92); opacity: .45; }
      to { transform: translate(-50%, -50%) rotateX(72deg) scale(1.08); opacity: 1; }
    }
    #stars { position: absolute; inset: 0; width: 100%; height: 100%; }
    .glow {
      position: absolute; width: 420px; height: 420px; border-radius: 50%;
      background: rgba(0, 112, 255, .12); filter: blur(100px);
      left: 50%; top: 50%; transform: translate(-50%, -50%);
    }
    .card-wrap {
      width: min(100%, 390px);
      perspective: 1200px;
      z-index: 1;
    }
    .card {
      --rx: 0deg; --ry: 0deg; --mx: 50%; --my: 50%;
      position: relative;
      width: 100%;
      min-height: 575px;
      padding: 42px 34px 27px;
      display: flex;
      flex-direction: column;
      align-items: center;
      border: 1px solid rgba(233, 200, 120, .48);
      border-radius: 28px;
      overflow: hidden;
      isolation: isolate;
      background:
        linear-gradient(145deg, rgba(18, 37, 72, .92), rgba(5, 12, 28, .96) 58%, rgba(8, 23, 47, .94));
      box-shadow: 0 35px 90px rgba(0, 0, 0, .55), 0 0 55px rgba(31, 122, 235, .13),
        inset 0 1px 0 rgba(255,255,255,.09);
      transform: rotateX(var(--rx)) rotateY(var(--ry));
      transform-style: preserve-3d;
      transition: transform .18s ease-out, box-shadow .35s ease;
      will-change: transform;
    }
    .card::before {
      content: ""; position: absolute; inset: 0; z-index: -1; pointer-events: none;
      background: radial-gradient(circle at var(--mx) var(--my), rgba(92, 174, 255, .19), transparent 38%);
    }
    .card::after {
      content: ""; position: absolute; inset: 10px; border: 1px solid rgba(255,255,255,.055);
      border-radius: 20px; pointer-events: none;
    }
    .top-line {
      position: absolute; top: 0; left: 15%; right: 15%; height: 1px;
      background: linear-gradient(90deg, transparent, var(--gold), transparent);
      box-shadow: 0 0 14px rgba(233, 200, 120, .55);
    }

    /* Мини-виджет QR MBANK в правом верхнем углу */
    .qr-corner {
      position: absolute;
      top: 18px;
      right: 18px;
      z-index: 10;
      width: 56px;
      height: 56px;
      padding: 5px;
      border-radius: 13px;
      border: 1px solid rgba(233, 200, 120, .45);
      background: rgba(7, 17, 38, .85);
      backdrop-filter: blur(8px);
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 16px rgba(0, 0, 0, .4), inset 0 0 10px rgba(233, 200, 120, .12);
      transition: transform .25s ease, border-color .25s ease, box-shadow .25s ease;
      transform: translateZ(42px);
    }
    .qr-corner:hover {
      transform: translateZ(48px) scale(1.08);
      border-color: var(--gold-bright);
      box-shadow: 0 6px 22px rgba(233, 200, 120, .28);
    }
    .qr-corner svg {
      width: 100%;
      height: 100%;
      display: block;
    }
    .qr-badge {
      position: absolute;
      bottom: -6px;
      background: linear-gradient(90deg, #10254a, #193b75);
      border: 1px solid rgba(233, 200, 120, .55);
      color: var(--gold-bright);
      font-size: 7px;
      font-weight: 700;
      letter-spacing: .12em;
      padding: 1px 5px;
      border-radius: 6px;
      text-transform: uppercase;
    }

    .brand { display: flex; flex-direction: column; align-items: center; transform: translateZ(38px); }
    .monogram {
      width: 112px; height: 112px; display: grid; place-items: center; position: relative;
      margin-bottom: 19px;
    }
    .monogram::before, .monogram::after {
      content: ""; position: absolute; inset: 8px; border: 1px solid rgba(233, 200, 120, .7);
      border-radius: 50%; transform: rotate(-28deg) scaleX(1.28);
      box-shadow: 0 0 18px rgba(233, 200, 120, .14);
    }
    .monogram::after {
      inset: 1px 14px; transform: rotate(55deg) scaleX(1.15);
      border-color: rgba(67, 160, 255, .55);
    }
    .monogram span {
      font-family: Georgia, "Times New Roman", serif; font-size: 72px; line-height: 1;
      font-weight: 400; color: transparent;
      background: linear-gradient(135deg, #fff4c9 12%, #d5a94e 48%, #fff0b6 75%, #a87928);
      background-clip: text; -webkit-background-clip: text;
      filter: drop-shadow(0 0 12px rgba(233, 200, 120, .3));
    }
    h1 {
      margin: 0; font-family: Georgia, "Times New Roman", serif;
      font-size: 32px; font-weight: 500; letter-spacing: .2em; padding-left: .2em;
      color: var(--gold-bright); text-shadow: 0 0 20px rgba(233, 200, 120, .22);
    }
    .subtitle {
      margin: 9px 0 0; color: #aebbd2; font-size: 11px; letter-spacing: .28em;
      text-transform: uppercase;
    }
    .separator {
      width: 100%; display: flex; align-items: center; gap: 12px; margin: 30px 0 20px;
      color: var(--gold); opacity: .75;
    }
    .separator::before, .separator::after {
      content: ""; height: 1px; flex: 1;
      background: linear-gradient(90deg, transparent, rgba(233,200,120,.6));
    }
    .separator::after { transform: scaleX(-1); }
    .separator span { font-size: 9px; letter-spacing: .3em; text-transform: uppercase; }
    .links { width: 100%; display: grid; gap: 11px; transform: translateZ(25px); }
    .contact {
      min-height: 50px; display: flex; align-items: center; gap: 14px;
      padding: 0 17px; border: 1px solid rgba(126, 164, 218, .2); border-radius: 13px;
      background: linear-gradient(100deg, rgba(17, 38, 72, .76), rgba(10, 22, 44, .58));
      color: #eaf2ff; text-decoration: none; font-size: 13px; letter-spacing: .045em;
      transition: transform .25s ease, border-color .25s ease, box-shadow .25s ease, background .25s ease;
      -webkit-tap-highlight-color: transparent;
    }
    .contact:hover, .contact:focus-visible {
      outline: none; transform: translateY(-3px) translateZ(8px);
      border-color: rgba(75, 170, 255, .85);
      background: linear-gradient(100deg, rgba(21, 57, 103, .92), rgba(10, 29, 57, .8));
      box-shadow: 0 8px 26px rgba(0, 119, 255, .17), inset 0 0 18px rgba(49, 145, 255, .07);
    }
    .contact svg { width: 19px; height: 19px; flex: 0 0 19px; color: var(--gold); }
    .contact .arrow { margin-left: auto; color: #7d9abd; font-size: 17px; }
    footer {
      width: 100%; margin-top: auto; padding-top: 22px; text-align: center;
      color: #8392ac; font-size: 9px; letter-spacing: .25em;
    }
    footer::before {
      content: ""; display: block; height: 1px; width: 100%; margin-bottom: 16px;
      background: linear-gradient(90deg, transparent, rgba(233,200,120,.55), transparent);
    }
    .hint {
      position: fixed; bottom: 18px; left: 0; right: 0; z-index: 2; text-align: center;
      color: rgba(169, 190, 220, .48); font-size: 10px; letter-spacing: .16em;
      text-transform: uppercase; pointer-events: none;
    }

    /* Модальное окно для удобного сканирования QR */
    .modal {
      position: fixed;
      inset: 0;
      z-index: 50;
      display: grid;
      place-items: center;
      padding: 20px;
      background: rgba(2, 6, 15, .82);
      backdrop-filter: blur(12px);
      opacity: 0;
      pointer-events: none;
      transition: opacity .25s ease;
    }
    .modal.active {
      opacity: 1;
      pointer-events: auto;
    }
    .modal-box {
      width: min(100%, 310px);
      padding: 26px 22px 22px;
      border-radius: 24px;
      border: 1px solid rgba(233, 200, 120, .55);
      background: linear-gradient(155deg, rgba(16, 34, 68, .96), rgba(6, 14, 32, .98));
      box-shadow: 0 25px 70px rgba(0,0,0,.7), 0 0 40px rgba(233, 200, 120, .14);
      text-align: center;
      transform: scale(.93);
      transition: transform .25s ease;
    }
    .modal.active .modal-box {
      transform: scale(1);
    }
    .modal-title {
      font-size: 11px;
      letter-spacing: .26em;
      text-transform: uppercase;
      color: var(--gold-bright);
      margin: 0 0 4px;
    }
    .modal-sub {
      font-size: 12px;
      color: var(--muted);
      margin: 0 0 16px;
    }
    .qr-large {
      width: 210px;
      height: 210px;
      margin: 0 auto 16px;
      padding: 12px;
      border-radius: 18px;
      background: #071126;
      border: 1px solid rgba(233, 200, 120, .38);
      box-shadow: inset 0 0 20px rgba(66, 165, 255, .12);
    }
    .qr-large svg {
      width: 100%;
      height: 100%;
    }
    .phone-copy {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 8px 14px;
      border-radius: 10px;
      border: 1px solid rgba(126, 164, 218, .25);
      background: rgba(17, 38, 72, .7);
      color: var(--white);
      font-size: 13px;
      cursor: pointer;
      transition: border-color .2s;
    }
    .phone-copy:hover {
      border-color: var(--gold);
    }
    .close-btn {
      display: block;
      width: 100%;
      margin-top: 14px;
      padding: 9px;
      background: transparent;
      border: none;
      color: var(--muted);
      font-size: 11px;
      letter-spacing: .18em;
      text-transform: uppercase;
      cursor: pointer;
    }
    .close-btn:hover { color: var(--white); }

    @media (max-width: 480px) {
      body { padding: 18px; }
      .card { min-height: 550px; padding: 35px 25px 24px; }
      .monogram { width: 100px; height: 100px; }
      .monogram span { font-size: 64px; }
      h1 { font-size: 28px; }
      .separator { margin: 26px 0 18px; }
      .contact { min-height: 48px; }
      .hint { display: none; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; }
    }
  </style>
</head>
<body>
  <div class="scene" aria-hidden="true">
    <div class="glow"></div>
    <canvas id="stars"></canvas>
  </div>

  <main class="card-wrap">
    <section class="card" id="card" aria-label="DANIYAR contact card">
      <div class="top-line"></div>

      <!-- Мини QR-код MBANK в правом верхнем углу -->
      <button type="button" class="qr-corner" id="openQr" title="Оплата MBANK (ELQR)" aria-label="Открыть QR-код MBANK">
        <div id="miniQrSlot" style="width:100%;height:100%;"></div>
        <span class="qr-badge">MBANK</span>
      </button>

      <div class="brand">
        <div class="monogram" aria-hidden="true"><span>D</span></div>
        <h1>DANIYAR</h1>
        <p class="subtitle">Developer &amp; Creator</p>
      </div>

      <div class="separator"><span>Get in touch</span></div>

      <nav class="links" aria-label="Contact links">
        <!-- Telegram -->
        <a class="contact" href="https://t.me/Dancho_kg" target="_blank" rel="noopener noreferrer">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m21 3-7.2 18-3.9-8.1L2 9.2 21 3Z"/><path d="M9.9 12.9 21 3"/></svg>
          <span>Telegram</span><span class="arrow">↗</span>

        <!-- WhatsApp -->
        <a class="contact" href="https://wa.me/996702431642" target="_blank" rel="noopener noreferrer">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20.4 11.8a8.4 8.4 0 0 1-12.5 7.3L3 20l.9-4.7a8.4 8.4 0 1 1 16.5-3.5Z"/><path d="M8.4 8.2c.2-.5.5-.5.8-.5h.5c.2 0 .4.1.5.4l.7 1.6c.1.3.1.5-.1.7l-.5.6c-.2.2-.2.4 0 .7.6 1 1.4 1.7 2.4 2.2.3.1.5.1.7-.1l.7-.8c.2-.2.4-.3.7-.2l1.5.7c.3.1.4.3.4.5 0 .4-.2 1.1-.6 1.4-.4.4-1 .6-1.6.5-1-.1-2.3-.7-3.7-1.9-1.2-1-2.1-2.4-2.4-3.4-.3-.9 0-1.7.4-2.4Z"/></svg>
          <span>WhatsApp</span><span class="arrow">↗</span>
        </a>
        <!-- TikTok -->
        <a class="contact" href="https://www.tiktok.com/@danyarov.1" target="_blank" rel="noopener noreferrer">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 12a4 4 0 1 0 4 4V4a5 5 0 0 0 5 5"/></svg>
          <span>TikTok</span><span class="arrow">↗</span>
        </a>
        <!-- Instagram -->
        <a class="contact" href="https://www.instagram.com/shayloobekov.1?gwpx=dWdiOHVqcjUwYW92&utm_source=qr" target="_blank" rel="noopener noreferrer">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.5" cy="6.5" r="1" fill="currentColor" stroke="none"/></svg>
          <span>Instagram</span><span class="arrow">↗</span>
        </a>
      </nav>

      <footer>© 2026 DANIYAR</footer>
    </section>
  </main>

  <!-- Модальное окно с увеличенным QR для сканирования -->
  <div class="modal" id="qrModal" role="dialog" aria-modal="true" aria-label="QR-код MBANK">
    <div class="modal-box">
      <p class="modal-title">MBANK • ELQR</p>
      <p class="modal-sub">Данияр Ш</p>
      <div class="qr-large" id="largeQrSlot"></div>
      <button type="button" class="phone-copy" id="copyPhone">
        <span>+996 (702) 431 642</span>
        <span id="copyState" style="color:var(--gold);font-size:11px;">Копировать</span>
      </button>
      <button type="button" class="close-btn" id="closeQr">Закрыть</button>
    </div>
  </div>

  <div class="hint" aria-hidden="true">Move your cursor to explore</div>

  <script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.min.js"></script>
  <script>
    (() => {
      const mbankPayload = "00020101021132440011qr.mbank.kg0104210010129967024316421302125204482953034175914%D0%94%D0%B0%D0%BD%D0%B8%D1%8F%D1%80%20%D0%A86304799B";

      function buildStyledQR(containerId, showCenterLogo) {
        const container = document.getElementById(containerId);
        if (!container || typeof qrcode === 'undefined') return;

        const qr = qrcode(0, 'M');
        qr.addData(decodeURIComponent(mbankPayload));
        qr.make();

        const count = qr.getModuleCount();
        const size = 200;
        const cell = size / count;
        let rects = '';

        for (let r = 0; r < count; r++) {
          for (let c = 0; c < count; c++) {
            if (!qr.isDark(r, c)) continue;

            if (showCenterLogo) {
              const mid = count / 2;
              if (Math.abs(r - mid) < 3.6 && Math.abs(c - mid) < 3.6) continue;
            }

            const isFinder = (r < 7 && c < 7) || (r < 7 && c >= count - 7) || (r >= count - 7 && c < 7);
            const fill = isFinder ? '#fff0b6' : '#e9c878';
            const rx = isFinder ? (cell * 0.25).toFixed(2) : (cell * 0.35).toFixed(2);
            rects += `<rect x="${(c * cell).toFixed(2)}" y="${(r * cell).toFixed(2)}" width="${(cell * 0.92).toFixed(2)}" height="${(cell * 0.92).toFixed(2)}" rx="${rx}" fill="${fill}"/>`;
          }
        }

        const centerMark = showCenterLogo
          ? `<rect x="81" y="81" width="38" height="38" rx="9" fill="#0a1936" stroke="#e9c878" stroke-width="1.5"/>
             <text x="100" y="106" text-anchor="middle" fill="#fff0b6" font-family="Georgia, serif" font-weight="bold" font-size="18">M</text>`
          : '';

        container.innerHTML = `<svg viewBox="0 0 ${size} ${size}" xmlns="http://www.w3.org/2000/svg" shape-rendering="geometricPrecision">${rects}${centerMark}</svg>`;
      }

      buildStyledQR('miniQrSlot', false);
      buildStyledQR('largeQrSlot', true);

      const modal = document.getElementById('qrModal');
      document.getElementById('openQr').addEventListener('click', () => modal.classList.add('active'));
      document.getElementById('closeQr').addEventListener('click', () => modal.classList.remove('active'));
      modal.addEventListener('click', (e) => { if (e.target === modal) modal.classList.remove('active'); });

      document.getElementById('copyPhone').addEventListener('click', () => {
        navigator.clipboard?.writeText('+996702431642');
        const st = document.getElementById('copyState');
        st.textContent = 'Скопировано ✓';
        setTimeout(() => { st.textContent = 'Копировать'; }, 1800);
      });

      const card = document.getElementById('card');
      const wrap = document.querySelector('.card-wrap');
      const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      let frame = 0;

      function setTilt(x, y, rect) {
        const px = (x - rect.left) / rect.width;
        const py = (y - rect.top) / rect.height;
        const rotateY = (px - 0.5) * 18;
        const rotateX = (0.5 - py) * 18;
        card.style.setProperty('--rx', rotateX.toFixed(2) + 'deg');
        card.style.setProperty('--ry', rotateY.toFixed(2) + 'deg');
        card.style.setProperty('--mx', (px * 100).toFixed(1) + '%');
        card.style.setProperty('--my', (py * 100).toFixed(1) + '%');
      }
      function resetTilt() {
        card.style.setProperty('--rx', '0deg');
        card.style.setProperty('--ry', '0deg');
        card.style.setProperty('--mx', '50%');
        card.style.setProperty('--my', '50%');
      }

      if (!reduceMotion) {
        wrap.addEventListener('pointermove', (event) => {
          if (event.pointerType === 'touch') return;
          cancelAnimationFrame(frame);
          frame = requestAnimationFrame(() => setTilt(event.clientX, event.clientY, card.getBoundingClientRect()));
        });
        wrap.addEventListener('pointerleave', resetTilt);

        let touchActive = false;
        wrap.addEventListener('touchstart', () => { touchActive = true; }, { passive: true });
        wrap.addEventListener('touchmove', (event) => {
          if (!touchActive || !event.touches.length) return;
          const t = event.touches[0];
          setTilt(t.clientX, t.clientY, card.getBoundingClientRect());
        }, { passive: true });
        wrap.addEventListener('touchend', () => { touchActive = false; resetTilt(); }, { passive: true });

        const enableOrientation = () => {
          if (!('DeviceOrientationEvent' in window)) return;
          const handle = (event) => {
            if (event.beta == null || event.gamma == null) return;
            const rx = Math.max(-10, Math.min(10, (event.beta - 45) * .22));
            const ry = Math.max(-10, Math.min(10, event.gamma * .22));
            card.style.setProperty('--rx', rx.toFixed(2) + 'deg');
            card.style.setProperty('--ry', ry.toFixed(2) + 'deg');
          };
          window.addEventListener('deviceorientation', handle, { passive: true });
        };
        if (typeof DeviceOrientationEvent !== 'undefined' &&
            typeof DeviceOrientationEvent.requestPermission === 'function') {
          document.addEventListener('click', function askOrientation() {
            DeviceOrientationEvent.requestPermission().then(result => {
              if (result === 'granted') enableOrientation();
            }).catch(() => {});
            document.removeEventListener('click', askOrientation);
          }, { once: true });
        } else {
          enableOrientation();
        }
      }

      const canvas = document.getElementById('stars');
      const ctx = canvas.getContext('2d');
      let stars = [];
      function resize() {
        const dpr = Math.min(window.devicePixelRatio || 1, 2);
        canvas.width = Math.floor(innerWidth * dpr);
        canvas.height = Math.floor(innerHeight * dpr);
        canvas.style.width = innerWidth + 'px';
        canvas.style.height = innerHeight + 'px';
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        stars = Array.from({ length: Math.min(100, Math.floor(innerWidth * innerHeight / 11000)) }, () => ({
          x: Math.random() * innerWidth, y: Math.random() * innerHeight,
          r: Math.random() * 1.35 + .25, a: Math.random() * .55 + .12,
          speed: Math.random() * .18 + .035, phase: Math.random() * Math.PI * 2
        }));
      }
      let tick = 0;
      function draw() {
        ctx.clearRect(0, 0, innerWidth, innerHeight);
        tick += .012;
        for (const s of stars) {
          const alpha = s.a * (.65 + .35 * Math.sin(tick * s.speed * 12 + s.phase));
          ctx.beginPath();
          ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
          ctx.fillStyle = `rgba(177, 211, 255, ${alpha})`;
          ctx.fill();
        }
        if (!reduceMotion) requestAnimationFrame(draw);
      }
      resize();
      draw();
      window.addEventListener('resize', resize, { passive: true });
    })();
  </script>
